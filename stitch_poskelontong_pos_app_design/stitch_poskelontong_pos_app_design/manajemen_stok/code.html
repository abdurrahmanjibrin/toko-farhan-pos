<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manajemen Stok - Warung Kita</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#9db2a3",
                        "error": "#ba1a1a",
                        "outline": "#737873",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dbdad7",
                        "surface-container-low": "#f5f3f1",
                        "primary-fixed-dim": "#b6ccbc",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#e3bdbe",
                        "surface-tint": "#4f6356",
                        "inverse-surface": "#30312f",
                        "background": "#fbf9f7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#2b1617",
                        "on-surface": "#1b1c1b",
                        "surface-bright": "#fbf9f7",
                        "tertiary-container": "#c8a4a5",
                        "surface-container": "#efeeeb",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdada",
                        "on-primary-fixed": "#0d1f15",
                        "primary-fixed": "#d2e8d8",
                        "surface": "#fbf9f7",
                        "on-secondary-fixed": "#031d30",
                        "tertiary": "#745758",
                        "secondary-container": "#cae2fb",
                        "on-primary-fixed-variant": "#384b3f",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#32495d",
                        "on-secondary-container": "#4e657a",
                        "on-tertiary-fixed-variant": "#5b4041",
                        "secondary-fixed": "#cde5fe",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e4e2e0",
                        "on-surface-variant": "#434844",
                        "inverse-primary": "#b6ccbc",
                        "on-tertiary-container": "#543a3b",
                        "on-background": "#1b1c1b",
                        "inverse-on-surface": "#f2f0ee",
                        "outline-variant": "#c3c8c2",
                        "on-primary-container": "#324539",
                        "surface-container-high": "#e9e8e6",
                        "primary": "#4f6356",
                        "surface-container-highest": "#e4e2e0",
                        "secondary": "#4a6176",
                        "secondary-fixed-dim": "#b1c9e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "touch-target-min": "48px",
                        "margin-mobile": "20px",
                        "gutter-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Nunito Sans"],
                        "headline-md": ["Nunito Sans"],
                        "body-md": ["Nunito Sans"],
                        "headline-lg": ["Nunito Sans"],
                        "title-lg": ["Nunito Sans"],
                        "body-lg": ["Nunito Sans"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                        "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }

<style>
        body { font-family: 'Nunito Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased pb-24 pt-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-touch-target-min bg-surface shadow-sm docked full-width top-0">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary-container">Manajemen Stok</h1>
</div>
<button aria-label="Notifications" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="max-w-md mx-auto w-full px-margin-mobile pt-6 flex flex-col gap-6">
<!-- Tabs -->
<div class="flex w-full bg-surface-container-low rounded-xl p-1 shadow-sm">
<button class="flex-1 py-3 px-4 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-high transition-colors text-center">
                Daftar Barang
            </button>
<button class="flex-1 py-3 px-4 rounded-lg font-label-lg text-label-lg bg-surface text-primary shadow-sm text-center">
                Beli Stok Masuk
            </button>
</div>
<!-- Content Canvas: Beli Stok Masuk Form View -->
<section class="flex flex-col gap-4">
<!-- Search / Select Product Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(45,55,72,0.08)] flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="product-search">Pilih Barang</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">search</span>
<input class="w-full h-touch-target-min pl-10 pr-4 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant" id="product-search" placeholder="Cari nama barang..." type="text"/>
</div>
<!-- Mock Selected Item -->
<div class="mt-2 flex items-center justify-between p-3 bg-surface-container-low rounded-lg border border-outline-variant">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined">inventory_2</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Beras Rojo Lele 5kg</span>
<span class="font-body-md text-body-md text-on-surface-variant">Stok saat ini: 12 Karung</span>
</div>
</div>
<button aria-label="Remove selection" class="text-error">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Quantity Input Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(45,55,72,0.08)] flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="qty-input">Jumlah Beli</label>
<div class="flex gap-2 w-full">
<input class="flex-1 h-touch-target-min px-4 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface text-right" id="qty-input" placeholder="0" type="number" value="5"/>
<select class="w-1/3 h-touch-target-min px-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface">
<option>Dus</option>
<option selected="">Karung</option>
<option>Pcs</option>
</select>
</div>
</div>
<!-- Cost Input Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(45,55,72,0.08)] flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="cost-input">Total Harga Modal</label>
<div class="relative w-full">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-label-lg text-label-lg text-on-surface-variant">Rp</span>
<input class="w-full h-touch-target-min pl-12 pr-4 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface text-right" id="cost-input" placeholder="0" type="text" value="325.000"/>
</div>
<div class="flex justify-between items-center mt-1">
<span class="font-body-md text-body-md text-on-surface-variant">Modal Satuan: Rp 65.000 / Karung</span>
</div>
</div>
<!-- Info Box -->
<div class="bg-secondary-container rounded-xl p-4 flex gap-3 items-start border border-secondary-fixed">
<span class="material-symbols-outlined text-on-secondary-container mt-0.5">info</span>
<p class="font-body-md text-body-md text-on-secondary-container">Sistem otomatis mengonversi ke satuan eceran dan menyesuaikan rata-rata modal.</p>
</div>
</section>
<!-- Spacer for FAB/Bottom Nav -->
<div class="h-24"></div>
</main>
<!-- Floating Primary Button -->
<div class="fixed bottom-[96px] left-0 w-full px-margin-mobile flex justify-center z-40">
<button class="w-full max-w-md h-[56px] rounded-xl bg-primary-container text-on-primary-container font-headline-md text-headline-md flex items-center justify-center shadow-[0_8px_16px_rgba(45,55,72,0.15)] active:scale-95 transition-transform duration-200">
            Simpan Stok Baru
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 h-20 bg-surface border-t border-outline-variant docked full-width bottom-0 rounded-t-xl">
<!-- Transaksi: Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 duration-150 w-full h-full rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">point_of_sale</span>
<span class="font-label-lg text-[12px] leading-[16px] font-semibold">Transaksi</span>
</a>
<!-- Riwayat: Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 duration-150 w-full h-full rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-lg text-[12px] leading-[16px] font-semibold">Riwayat</span>
</a>
<!-- Stok: Active -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-1 w-auto h-auto transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-label-lg text-[12px] leading-[16px] font-semibold">Stok</span>
</a>
<!-- Laporan: Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 duration-150 w-full h-full rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">assessment</span>
<span class="font-label-lg text-[12px] leading-[16px] font-semibold">Laporan</span>
</a>
</nav>
</body></html>
