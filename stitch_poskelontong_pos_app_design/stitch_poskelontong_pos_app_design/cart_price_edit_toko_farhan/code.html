<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cart &amp; Quick Price Edit - Toko Farhan</title>

                    "spacing": {

                        "margin-mobile": "20px",

                    "fontFamily": {
                        "headline-lg": ["Nunito Sans"],
                        "headline-md": ["Nunito Sans"],

                        "body-lg": ["Nunito Sans"]

                    "fontSize": {

<style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: rgba(27, 28, 27, 0.4); /* Simulated dimming for modal */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Bottom sheet layout */
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent background scroll */
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }

        /* Hide scrollbar for clean UI but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-on-background/40">
<!-- Screen Content: Suppressing TopAppBar and BottomNavBar as this is a focused, transactional view (Modal Bottom Sheet) -->
<!-- Bottom Sheet Container -->
<div class="w-full max-w-[480px] bg-surface rounded-t-[24px] shadow-[0_-8px_32px_rgba(45,55,72,0.15)] flex flex-col h-[751px] animate-slide-up relative">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant rounded-full opacity-60"></div>
</div>
<!-- Header Area -->
<div class="px-margin-mobile pb-4 flex items-center justify-between border-b border-surface-variant">
<div class="flex items-center gap-3">
<!-- Close Action (Implied departure from main flow) -->
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-container-high active:scale-95 transition-all text-on-surface">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Keranjang</h1>
</div>
<!-- Printer Status Indicator -->
<div class="flex items-center gap-2 px-3 py-1.5 bg-surface-container rounded-full">
<span class="material-symbols-outlined text-[18px] text-primary">print</span>
<span class="font-body-md text-body-md text-on-surface-variant">Siap</span>
</div>
</div>
<!-- Cart Items List (Scrollable Area) -->
<div class="flex-1 overflow-y-auto no-scrollbar px-margin-mobile py-4 space-y-4">
<!-- Item 1 -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(45,55,72,0.06)] flex flex-col gap-3 border border-outline-variant/30">
<div class="flex justify-between items-start">
<div class="flex-1 pr-4">
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Beras Maknyuss 5kg</h3>
<!-- Editable Price Area -->
<div class="flex items-center gap-2 mt-1">
<span class="font-body-lg text-body-lg text-on-surface-variant line-through opacity-70">Rp 65.000</span>
<div class="flex items-center gap-1.5 text-primary bg-primary-fixed rounded-lg px-2 py-1">
<span class="font-title-lg text-title-lg font-bold">Rp 62.000</span>
<button class="p-1 rounded-full hover:bg-primary-container active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[16px] fill">edit</span>
</button>
</div>
</div>
</div>
</div>
<div class="flex items-center justify-between mt-2 pt-3 border-t border-surface-variant/50">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal: Rp 124.000</span>
<!-- Stepper Control -->
<div class="flex items-center bg-surface-container rounded-full border border-outline-variant/50">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high rounded-l-full active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-10 text-center font-title-lg text-title-lg text-on-surface">2</span>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-primary-container hover:text-on-primary-container rounded-r-full active:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Item 2 -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(45,55,72,0.06)] flex flex-col gap-3 border border-outline-variant/30">
<div class="flex justify-between items-start">
<div class="flex-1 pr-4">
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Minyak Goreng Bimoli 2L</h3>
<!-- Editable Price Area -->
<div class="flex items-center gap-2 mt-1">
<div class="flex items-center gap-1.5 text-on-surface">
<span class="font-title-lg text-title-lg">Rp 34.500</span>
<button class="p-1 rounded-full text-on-surface-variant hover:bg-surface-variant active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
</div>
</div>
</div>
<div class="flex items-center justify-between mt-2 pt-3 border-t border-surface-variant/50">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal: Rp 34.500</span>
<!-- Stepper Control -->
<div class="flex items-center bg-surface-container rounded-full border border-outline-variant/50">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high rounded-l-full active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-10 text-center font-title-lg text-title-lg text-on-surface">1</span>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-primary-container hover:text-on-primary-container rounded-r-full active:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Item 3 -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(45,55,72,0.06)] flex flex-col gap-3 border border-outline-variant/30">
<div class="flex justify-between items-start">
<div class="flex-1 pr-4">
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">Gula Pasir Gulaku 1kg</h3>
<!-- Editable Price Area -->
<div class="flex items-center gap-2 mt-1">
<div class="flex items-center gap-1.5 text-on-surface">
<span class="font-title-lg text-title-lg">Rp 16.000</span>
<button class="p-1 rounded-full text-on-surface-variant hover:bg-surface-variant active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
</div>
</div>
</div>
<div class="flex items-center justify-between mt-2 pt-3 border-t border-surface-variant/50">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal: Rp 48.000</span>
<!-- Stepper Control -->
<div class="flex items-center bg-surface-container rounded-full border border-outline-variant/50">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high rounded-l-full active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-10 text-center font-title-lg text-title-lg text-on-surface">3</span>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-primary-container hover:text-on-primary-container rounded-r-full active:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Spacing at bottom to ensure last item isn't hidden by sticky footer -->
<div class="h-4"></div>
</div>
<!-- Sticky Footer Area: Total & Checkout Action -->
<div class="px-margin-mobile py-4 bg-surface shadow-[0_-4px_16px_rgba(0,0,0,0.05)] border-t border-surface-variant z-10">
<div class="flex justify-between items-end mb-4">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface-variant">Total Pesanan (6 item)</span>
<span class="font-headline-lg text-headline-lg text-primary mt-1">Rp 206.500</span>
</div>
<!-- Small discount indicator -->
<div class="bg-tertiary-fixed text-on-tertiary-fixed-variant px-2 py-1 rounded text-xs font-bold border border-tertiary-fixed-dim">
                    Diskon Rp 6.000
                </div>
</div>
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-lg text-title-lg flex items-center justify-center gap-2 shadow-[0_4px_12px_rgba(79,99,86,0.3)] hover:bg-primary/90 active:scale-[0.98] transition-all">
                Pilih Pembayaran
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
